<h1>Todo App!</h1>

<input type="text"  #userInput placeholder="Add a new todo"/>
<button (click)="addTodo(userInput.value)">Add</button>

@for(item of items() ; track $index ; let i = $index)
{
    <div class="todo-item">
        <p>{{i+1}}.{{ item }}</p>
        <button (click)="deleteTodo(i)">Delete</button>
    </div>
}
